<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<title>变电安全题库</title>
<style>
:root{--brand:#0f766e;--brand2:#115e59;--bg:#f3f7f6;--card:#fff;--text:#123;--muted:#64748b;--ok:#15803d;--bad:#b91c1c;--line:#dbe5e2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;padding:12px 12px 10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px #0002}h1{font-size:20px;margin:0 0 3px}header p{margin:0;color:#d9fffa;font-size:12px}
.wrap{max-width:760px;margin:auto;padding:8px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.toolbar select,.toolbar button,.actions button{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;font-size:13px}.toolbar button,.actions button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}.stat{background:var(--card);border-radius:9px;padding:6px 3px;text-align:center;border:1px solid var(--line)}.stat b{display:block;font-size:16px;color:var(--brand2)}.stat span{font-size:11px;color:var(--muted)}
.progress{height:6px;background:#dfeae7;border-radius:99px;overflow:hidden;margin:6px 0}.progress i{display:block;height:100%;background:var(--brand);transition:width .2s}
.navigator-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:5px 2px 3px}.legend{display:flex;gap:7px}.legend i{font-style:normal}.legend .green{color:var(--ok)}.legend .red{color:var(--bad)}
.navigator{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;max-height:58px;overflow-y:auto;padding:2px;background:#e7f0ee;border-radius:8px}.nav-number{border:1px solid #cbd8d5;border-radius:5px;background:#fff;color:#475569;font-size:11px;line-height:22px;height:23px;padding:0;cursor:pointer}.nav-number.current{outline:2px solid var(--brand);outline-offset:-1px;font-weight:700}.nav-number.correct{background:#dcfce7;border-color:#86efac;color:#166534}.nav-number.wrong{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.navigator-panel{position:fixed;inset:0;z-index:30;background:#0f172acc;padding:12px;display:flex;align-items:stretch}.navigator-modal{width:min(760px,100%);height:100%;margin:auto;background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;box-shadow:0 8px 30px #0006}.navigator-modal .navigator-head{font-size:15px;margin:0 0 10px}.navigator-modal .navigator-head button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 12px;color:var(--text)}.navigator-modal .navigator{flex:1;max-height:none;overflow-y:auto;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;padding:8px}.navigator-modal .nav-number{height:38px;line-height:36px;font-size:14px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 4px 16px #0f766e0d}.meta{font-size:11px;color:var(--muted);margin-bottom:4px}.question{font-size:16px;line-height:1.4;font-weight:600;white-space:pre-wrap}.hint{font-size:11px;color:var(--muted);margin:5px 0}
.option{display:flex;align-items:flex-start;gap:7px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin:5px 0;cursor:pointer;line-height:1.3;background:#fff;font-size:14px}.option:has(input:checked){border-color:var(--brand);background:#ecfdf8}.option input{margin-top:2px;accent-color:var(--brand);transform:scale(1.05)}.letter{font-weight:700;color:var(--brand2);min-width:18px}.option.disabled{cursor:default}.option.correct{border-color:#86efac;background:#f0fdf4}.option.wrong{border-color:#fca5a5;background:#fef2f2}
.actions{display:flex;gap:6px;margin-top:7px}.actions button{flex:1;min-height:38px}.feedback{margin-top:7px;border-radius:9px;padding:8px;font-size:13px;line-height:1.45}.feedback.ok{background:#f0fdf4;color:#166534}.feedback.bad{background:#fef2f2;color:#991b1b}.feedback b{font-weight:700}.explain{margin-top:6px;color:#334155;white-space:pre-wrap}.wrong-action{text-align:center;margin-top:4px}.wrong-action button{border:0;background:none;color:var(--bad);font-size:12px;text-decoration:underline;padding:2px 5px}
.empty{text-align:center;padding:24px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;padding:12px}.linkbtn{border:0;background:none;color:var(--brand2);text-decoration:underline;padding:0;font-size:12px}
@media(max-width:480px){.question{font-size:15px}.toolbar select,.toolbar button{flex:1}.stats{gap:4px}.stat{padding:5px 2px}.navigator{grid-template-columns:repeat(10,minmax(0,1fr));max-height:54px}.navigator-modal{padding:10px}.navigator-modal .navigator{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:6px}.navigator-modal .nav-number{height:40px;line-height:38px}.option{font-size:13px;padding:6px 7px;margin:4px 0}.actions button{min-height:36px}}
@media(max-height:720px){header{padding:8px 10px 7px}h1{font-size:18px}.wrap{padding:5px}.toolbar{margin:4px 0}.stats{margin:4px 0}.navigator-head{margin:3px 2px 2px}.navigator{max-height:42px}.card{padding:8px}.question{font-size:14px;line-height:1.3}.hint{margin:3px 0}.option{padding:5px 6px;margin:3px 0;font-size:12px}.actions{margin-top:5px}.actions button{min-height:32px}.feedback{margin-top:5px;padding:6px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>变电安全题库</h1><p>变电检修（A）＋变电基建（A） · 手机刷题版</p></div></header>
<main class="wrap">
<div class="toolbar"><select id="source"><option value="all">全部题目（384）</option><option value="检修">变电检修（A）</option><option value="基建">变电基建（A）</option></select><select id="mode"><option value="practice">顺序刷题</option><option value="random">随机刷题</option><option value="wrong">错题重做</option></select><button id="resetWrong">清除错题痕迹</button><button id="reset">重置全部记录</button><button id="toggleNavigator">题号跳转</button></div>
<div class="stats"><div class="stat"><b id="done">0</b><span>已作答</span></div><div class="stat"><b id="correct">0</b><span>答对</span></div><div class="stat"><b id="rate">0%</b><span>正确率</span></div><div class="stat"><b id="wrongCount">0</b><span>待重做</span></div></div>
<div class="progress"><i id="bar" style="width:0%"></i></div>
<div id="navigatorPanel" class="navigator-panel" hidden><div class="navigator-modal"><div class="navigator-head"><span>题号跳转</span><span class="legend"><i class="green">绿：答对</i><i class="red">红：答错</i><button id="closeNavigator">关闭</button></span></div><div id="navigator" class="navigator"></div></div></div>
<section id="app" class="card"></section>
<footer>题目来源：用户提供的《9.变电检修（A）.xlsx》《10.变电基建（A）.xlsx》<br>可添加到手机主屏幕，支持离线使用</footer>
</main>
<script>
const APP_VERSION='v5-2026-10-17';const STATS_KEY='bian-stats-'+APP_VERSION;const POS_KEY='bian-pos-'+APP_VERSION;const $=s=>document.querySelector(s);if(localStorage.getItem('bian-app-version')!==APP_VERSION){Object.keys(localStorage).filter(key=>(key.startsWith('bian-stats')||key.startsWith('bian-pos'))&&key!==STATS_KEY&&key!==POS_KEY).forEach(key=>localStorage.removeItem(key));localStorage.setItem('bian-app-version',APP_VERSION)}let all=[],list=[],idx=0,answered=false,lastCorrect=false,navigatorOpen=false,stats=JSON.parse(localStorage.getItem(STATS_KEY)||'{"done":0,"correct":0,"wrong":[]}');stats.answers=stats.answers||{};
function save(){localStorage.setItem(STATS_KEY,JSON.stringify(stats));localStorage.setItem(POS_KEY,JSON.stringify({source:$('#source').value,mode:$('#mode').value,idx}))}
function isMulti(q){return q.answer.replace(/\s/g,'').length>1&&!['T','F'].includes(q.answer.trim())}
function label(i){return String.fromCharCode(65+i)}
function answerText(q){let a=q.answer.trim(); if(a==='T')return '正确'; if(a==='F')return '错误'; return a.split('').join('、')}
function keyOf(q){return q.source+'#'+q.id}
function build(){let s=$('#source').value,m=$('#mode').value;list=all.filter(q=>s==='all'||q.source.includes(s));if(m==='wrong')list=list.filter(q=>stats.wrong.includes(keyOf(q)));if(m==='random')list=[...list].sort(()=>Math.random()-.5);idx=Math.min(idx,list.length-1);if(idx<0)idx=0;answered=false;lastCorrect=false;render();}
function renderNavigator(){let nav=$('#navigator');if(!nav)return;nav.innerHTML=list.map((q,i)=>{let key=keyOf(q),record=stats.answers[key],status=record?(record.ok?'correct':'wrong'):'';return `<button class="nav-number ${status}${i===idx?' current':''}" data-index="${i}" title="第${i+1}题">${i+1}</button>`}).join('');nav.querySelectorAll('.nav-number').forEach(button=>button.onclick=()=>{idx=+button.dataset.index;answered=false;lastCorrect=false;navigatorOpen=false;$('#navigatorPanel').hidden=true;render()})}
function render(){updateStats();renderNavigator();let el=$('#app');if(!list.length){el.innerHTML='<div class="empty">当前筛选下没有题目。<br><br><button class="toolbar button" onclick="$(\'#mode\').value=\'practice\';build()">返回全部题目</button></div>';return}let q=list[idx];let key=keyOf(q);let record=stats.answers[key];let redo=$('#mode').value==='wrong';answered=!!record&&!redo;lastCorrect=!!record?.ok;let multi=isMulti(q);let type=q.answer==='T'||q.answer==='F'?'判断题':multi?'多选题':'单选题';el.innerHTML=`<div class="meta">第 ${idx+1} / ${list.length} 题 · ${type} · ${q.source.includes('检修')?'变电检修（A）':'变电基建（A）'}</div><div class="question">${esc(q.question)}</div><div class="hint">${redo?'错题重做：之前选项已保留，可重新选择并点击下一题':multi?'请选择全部正确选项，点击下一题后查看结果':type==='判断题'?'请选择“正确”或“错误”，将立即显示结果':'请选择一个答案，将立即显示结果'}</div><div id="opts">${q.options.map((o,i)=>`<label class="option" data-i="${i}"><input type="${multi?'checkbox':'radio'}" name="answer" value="${i}"${record&&record.picked.includes(i)?' checked':''}><span class="letter">${label(i)}</span><span>${esc(o)}</span></label>`).join('')}</div><div class="actions"><button id="prev">上一题</button><button class="primary" id="next">下一题</button></div>${redo?'<div class="wrong-action"><button id="removeWrong">从错题重做中移出</button></div>':''}<div id="feedback"></div>`;$('#prev').onclick=()=>{idx=Math.max(0,idx-1);answered=false;lastCorrect=false;render()};$('#next').onclick=()=>advance(q);if(redo)$('#removeWrong').onclick=()=>removeWrong(q);document.querySelectorAll('input[name=answer]').forEach(input=>input.onchange=()=>{if(!multi&&!answered)check(q)});if(answered)showAnswer(q,lastCorrect)}
function selected(){return [...document.querySelectorAll('input[name=answer]:checked')].map(x=>+x.value)}
function removeWrong(q){let key=keyOf(q);stats.wrong=stats.wrong.filter(item=>item!==key);save();list=list.filter(item=>keyOf(item)!==key);if(idx>=list.length)idx=list.length-1;answered=false;lastCorrect=false;render()}
function advance(q){if(!answered&&selected().length){check(q);return}if(idx<list.length-1){idx++;answered=false;lastCorrect=false;render()}else{alert('本组题目已完成！');}}
function normalizedPicked(q,picked){if(q.answer==='T'||q.answer==='F')return picked.map(i=>i===0?'T':'F').join('');return picked.map(label).sort().join('')}
function check(q){let picked=selected();if(!picked.length){alert('请先选择答案');return}let letters=normalizedPicked(q,picked);let ok=letters===q.answer.trim().replace(/\s/g,'').split('').sort().join('');let key=q.source+'#'+q.id;let prior=stats.answers[key];if(!prior){stats.done++;if(ok)stats.correct++;}else if(prior.ok!==ok){stats.correct+=ok?1:-1}if(!ok&&!stats.wrong.includes(key))stats.wrong.push(key);stats.answers[key]={picked,ok,explain:prior?.explain||false};answered=true;lastCorrect=ok;save();showAnswer(q,ok);updateStats()}
function showAnswer(q,ok){document.querySelectorAll('.option').forEach((e,i)=>{e.classList.add('disabled');let right=q.answer==='T'?i===0:q.answer==='F'?i===1:q.answer.includes(label(i));if(right)e.classList.add('correct');if(e.querySelector('input').checked&&!right)e.classList.add('wrong');e.querySelector('input').disabled=true});let f=$('#feedback');if(!f)return;f.className='feedback '+(ok===false?'bad':'ok');let result=`<b>${ok===false?'回答错误':'回答正确'}</b> · 正确答案：${answerText(q)}`;let explain=`<div class="explain"><b>解析：</b>${esc(q.explain||'请结合题干和现场安全操作规范判断。')}</div>`;let record=stats.answers[q.source+'#'+q.id];if(ok===false||record?.explain)f.innerHTML=result+explain;else f.innerHTML=result+'<br><button id="showExplain" class="linkbtn">查看解析</button><div id="explainBox" hidden>'+explain+'</div>';if(ok!==false&&!record?.explain)$('#showExplain').onclick=()=>{record.explain=true;save();$('#explainBox').hidden=false;$('#showExplain').hidden=true}}
function next(){if(idx<list.length-1){idx++;answered=false;render()}else{alert('本组题目已完成！');}}
function updateStats(){$('#done').textContent=stats.done;$('#correct').textContent=stats.correct;$('#rate').textContent=stats.done?Math.round(stats.correct/stats.done*100)+'%':'0%';$('#wrongCount').textContent=stats.wrong.length;$('#bar').style.width=list.length?((idx+1)/list.length*100)+'%':'0%';renderNavigator()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){let r=await fetch('questions.json');all=await r.json();let p=JSON.parse(localStorage.getItem(POS_KEY)||'{}');if(p.source)$('#source').value=p.source;if(p.mode)$('#mode').value=p.mode;$('#navigatorPanel').hidden=true;$('#toggleNavigator').onclick=()=>{navigatorOpen=!navigatorOpen;$('#navigatorPanel').hidden=!navigatorOpen;if(navigatorOpen)renderNavigator()};$('#closeNavigator').onclick=()=>{navigatorOpen=false;$('#navigatorPanel').hidden=true};build();$('#source').onchange=()=>{idx=0;build()};$('#mode').onchange=()=>{idx=0;build()};$('#resetWrong').onclick=()=>{if(confirm('清除错题的作答痕迹，但保留错题列表吗？')){stats.wrong.forEach(key=>delete stats.answers[key]);save();build()}};$('#reset').onclick=()=>{if(confirm('确定清空全部答题统计、选项记录和错题吗？')){stats={done:0,correct:0,wrong:[],answers:{}};idx=0;save();build()}};if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}
init();
</script>
</body></html>
